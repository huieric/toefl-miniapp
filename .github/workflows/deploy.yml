name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  # ==================== 构建前端 ====================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-frontend
          path: web/dist/
          retention-days: 30

  # ==================== 打包后端 ====================
  package-backend:
    name: Package Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - name: Install production deps
        run: npm ci --production

      - name: Package backend
        run: |
          cd ..
          tar -czf server-dist.tar.gz server/ \
            --exclude='server/node_modules' \
            --exclude='server/.venv' \
            --exclude='server/uploads/*' \
            --exclude='server/logs/*' \
            --exclude='server/temp/*'

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-backend
          path: server-dist.tar.gz
          retention-days: 30

  # ==================== 部署 ====================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-frontend, package-backend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://toefl-prep.example.com  # 替换为实际域名
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: production-frontend
          path: dist/

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: production-backend
          path: /tmp/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          # 上传前端
          scp -i ~/.ssh/deploy_key -r dist/* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_WEB_PATH }}/

          # 解压并上传后端
          tar -xzf /tmp/production-backend.tar.gz -C /tmp/
          scp -i ~/.ssh/deploy_key -r /tmp/server/* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_SERVER_PATH }}/

          # 远程重启服务
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_SERVER_PATH }}
            pm2 restart toefl-server || pm2 start ecosystem.config.js
          EOF

      - name: Verify deployment
        run: |
          sleep 5
          curl -f https://toefl-prep.example.com/api/health || echo "Warning: Health check failed"

      - name: Notify success
        if: success()
        run: echo "✅ Deployment successful!"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed!"
