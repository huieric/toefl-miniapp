<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>托福备考助手</title>
  <!-- PWA -->
  <link rel="manifest" href="/toefl-miniapp/web/manifest.json" />
  <meta name="theme-color" content="#4255FF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="托福助手" />
  <link rel="apple-touch-icon" href="/toefl-miniapp/web/icons/icon-192.png" />
  <!-- Service Worker -->
  <script type="module">
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/toefl-miniapp/web/sw.js', { scope: '/toefl-miniapp/web/' })
          .then(reg => {
            console.log('[PWA] SW registered:', reg.scope)
            // 检测更新
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA] 新内容可用，刷新以更新')
                }
              })
            })
          })
          .catch(err => console.error('[PWA] SW registration failed:', err))
      })
    }
  </script>
  <style>
    .app-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #F5F7FF; color: #4A6CF7; font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .app-loading .brand { font-size: 24px; font-weight: 700; letter-spacing: 0.02em; }
    .app-loading .spin {
      width: 30px; height: 30px; border: 3px solid rgba(74,108,247,0.2); border-top-color: #4A6CF7;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="app-loading">
      <div class="brand">托福备考助手</div>
      <div class="spin"></div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
