<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEFL Prep - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F7FF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .offline-container {
      text-align: center;
      padding: 40px 24px;
      max-width: 400px;
    }
    .offline-icon {
      font-size: 72px;
      margin-bottom: 16px;
    }
    h2 {
      color: #333;
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      color: #888;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-retry {
      display: inline-block;
      padding: 12px 32px;
      background: #4255FF;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-retry:hover { opacity: 0.85; }
    .stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #E5E8F0;
    }
    .stat-item { text-align: center; }
    .stat-val {
      font-size: 24px;
      font-weight: 800;
      color: #4255FF;
    }
    .stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h2 id="title"></h2>
    <p id="desc"></p>
    <button class="btn-retry" onclick="window.location.reload()"></button>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-val" id="cachedCount">0</div>
        <div class="stat-label" id="labelWrong"></div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="cachedData">0</div>
        <div class="stat-label" id="labelPractice"></div>
      </div>
    </div>
  </div>
  <script>
    // 根据浏览器语言自动切换
    (function() {
      var lang = navigator.language.startsWith('zh') ? 'zh-CN' : 'en';
      var i18n = {
        'zh-CN': {
          title: '暂无网络连接',
          desc: '请检查您的网络设置后点击重试。<br>已缓存的错题和练习数据可在联网后使用。',
          retry: '🔄 重试',
          wrong: '已缓存错题',
          practice: '已缓存练习'
        },
        'en': {
          title: 'No Network Connection',
          desc: 'Please check your connection and retry.<br>Cached data will sync when online.',
          retry: '🔄 Retry',
          wrong: 'Cached Wrong',
          practice: 'Cached Practice'
        }
      };
      var d = i18n[lang] || i18n['en'];
      document.getElementById('title').innerHTML = d.title;
      document.getElementById('desc').innerHTML = d.desc;
      document.querySelector('.btn-retry').textContent = d.retry;
      document.getElementById('labelWrong').textContent = d.wrong;
      document.getElementById('labelPractice').textContent = d.practice;
      document.documentElement.lang = lang === 'zh-CN' ? 'zh-CN' : 'en';
    })();
    // 显示已缓存的数据数量
    if (window.indexedDB) {
      var db = window.indexedDB.open('toefl-offline', 2);
      db.onsuccess = function(e) {
        var store = e.target.result.transaction('wrong-questions', 'readonly').objectStore('wrong-questions');
        store.count().then(function(c) {
          document.getElementById('cachedCount').textContent = c;
        });
      };
    }
  </script>
</body>
</html>
